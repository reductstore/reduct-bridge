services:
  reductstore:
    image: reduct/store:main@sha256:85402f88e8618a14ce0f57b55f53e724463c66d89623d0807f42a860683a92e8
    ports:
      - "8383:8383"
    environment:
      RS_BUCKET_A_NAME: proto-test
      RS_BUCKET_A_QUOTA_TYPE: FIFO
      RS_BUCKET_A_QUOTA_SIZE: 100MB
      RS_BUCKET_B_NAME: json-test
      RS_BUCKET_B_QUOTA_TYPE: FIFO
      RS_BUCKET_B_QUOTA_SIZE: 100MB
      RS_BUCKET_C_NAME: proto-nodesc-test
      RS_BUCKET_C_QUOTA_TYPE: FIFO
      RS_BUCKET_C_QUOTA_SIZE: 100MB

  mosquitto:
    image: eclipse-mosquitto:2@sha256:6dba0f1b2795ddcbe0d41bdfb8b8d56a423acca23ccde4342a4652be54639b11
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  publisher:
    build:
      context: .
      dockerfile: Dockerfile.proto
    depends_on:
      - mosquitto
    restart: unless-stopped

  publisher-json:
    build:
      context: .
      dockerfile: Dockerfile.json
    depends_on:
      - mosquitto
    restart: unless-stopped

  bridge:
    image: ubuntu:24.04@sha256:023f8a753c22258c9fe2d0005a7d28258038da7d620e9f93e9ad78aa266f9f11
    volumes:
      - ../../target/debug/reduct-bridge:/usr/local/bin/reduct-bridge:ro
      - ./bridge.toml:/etc/bridge.toml:ro
      - ./factory.desc:/app/factory.desc:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
    command: ["reduct-bridge", "/etc/bridge.toml"]
    depends_on:
      - reductstore
      - mosquitto
    restart: unless-stopped
