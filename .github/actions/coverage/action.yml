name: 'Generate Code Coverage'
description: 'Downloads and runs test binaries with coverage instrumentation for a given target.'
inputs:
  os:
    description: 'Operating system.'
    required: true
  target:
    description: 'Target triple.'
    required: true
  action_github_token:
    description: 'GitHub token for authentication.'
    required: true
  cargo-args:
    description: 'Additional cargo arguments such as feature flags.'
    required: false
    default: ''
  ros-setup-script:
    description: 'Optional ROS setup script to source before cargo commands.'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4

    - name: Resolve Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        toolchain="$(python3 - <<'PY'
        import tomllib
        with open('rust-toolchain.toml', 'rb') as fh:
            print(tomllib.load(fh)['toolchain']['channel'])
        PY
        )"
        echo "RUST_TOOLCHAIN=${toolchain}" >> "$GITHUB_ENV"
        echo "RUSTUP_TOOLCHAIN=${toolchain}" >> "$GITHUB_ENV"

    - name: Install Rust
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt --component llvm-tools-preview

    - name: Install cargo-llvm-cov
      shell: bash
      run: cargo install cargo-llvm-cov --version 0.8.7 --locked --force

    - name: Run ReductStore integration test (CI feature)
      shell: bash
      env:
        REDUCTSTORE_URL: http://127.0.0.1:8383
        CARGO_TERM_COLOR: always
        RUST_LOG: debug
      run: |
        set -e -x
        if [[ -n "${{ inputs.ros-setup-script }}" ]]; then
          set +u
          source "${{ inputs.ros-setup-script }}"
          set -u
        fi
        cargo test --locked ${{ inputs.cargo-args }} ci_reductstore_roundtrip_data_and_attachment -- --nocapture

    - name: Run code coverage
      shell: bash
      env:
        REDUCTSTORE_URL: http://127.0.0.1:8383
        CARGO_TERM_COLOR: always
        RUST_LOG: debug
      run: |
        set -e -x
        if [[ -n "${{ inputs.ros-setup-script }}" ]]; then
          set +u
          source "${{ inputs.ros-setup-script }}"
          set -u
        fi
        cargo llvm-cov --locked --workspace ${{ inputs.cargo-args }} --lcov --output-path lcov.info

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: lcov.info
        path: lcov.info
