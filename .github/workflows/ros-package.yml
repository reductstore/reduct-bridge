name: ROS Package

on:
  push:
    branches: [main, stable]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-package:
    name: ${{ matrix.ros_distro }} package (amd64)
    strategy:
      matrix:
        include:
          - artifact_prefix: "bridge-ros2-lyrical"
            os: ubuntu-26.04
            ros_distro: "lyrical"
            ros_setup_script: "/opt/ros/lyrical/setup.bash"
          - artifact_prefix: "bridge-ros2-jazzy"
            os: ubuntu-24.04
            ros_distro: "jazzy"
            ros_setup_script: "/opt/ros/jazzy/setup.bash"
          - artifact_prefix: "bridge-ros2-humble"
            os: ubuntu-22.04
            ros_distro: "humble"
            ros_setup_script: "/opt/ros/humble/setup.bash"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ROS 2 and package tools
        uses: ros-tooling/setup-ros@649ef6bcd696da05bc27ceb3fab69d810c0daeab
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - name: Install ROS interfaces and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper \
            devscripts \
            equivs \
            python3-bloom \
            python3-colcon-common-extensions \
            python3-rosdep \
            ros-${{ matrix.ros_distro }}-example-interfaces \
            ros-${{ matrix.ros_distro }}-test-msgs

      - name: Initialize rosdep
        run: |
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            sudo rosdep init
          fi
          rosdep update

      - name: Verify Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustc --version
          cargo --version
          rustc --version | grep -Eq '^rustc 1\.96\.'

      - name: Build Bloom Debian package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/bloom_package"
          mkdir -p "${package_dir}"
          cp -a "${GITHUB_WORKSPACE}/." "${package_dir}/"
          cd "${package_dir}"

          os_codename="$(. /etc/os-release && printf '%s' "${VERSION_CODENAME}")"
          bloom-generate rosdebian \
            --ros-distro "${{ matrix.ros_distro }}" \
            --os-name ubuntu \
            --os-version "${os_codename}"

          expected_dependency="ros-${{ matrix.ros_distro }}-ros-environment"
          build_dependencies="$(grep '^Build-Depends:' debian/control)"
          if [[ "${build_dependencies}" != *"${expected_dependency}"* ]]; then
            echo "Bloom did not add ${expected_dependency} to Build-Depends"
            exit 1
          fi

          sudo mk-build-deps \
            --install \
            --remove \
            --tool "apt-get --no-install-recommends -y" \
            debian/control

          # Match the build farm: the generated rules must source the ROS
          # environment instead of inheriting it from the GitHub runner.
          env \
            -u AMENT_PREFIX_PATH \
            -u CMAKE_PREFIX_PATH \
            -u COLCON_PREFIX_PATH \
            -u LD_LIBRARY_PATH \
            -u PYTHONPATH \
            -u ROS_DISTRO \
            dpkg-buildpackage -b -us -uc -Pnocheck

      - name: Build Rust package
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source ${{ matrix.ros_setup_script }}
          set -u
          cargo build --release --locked --no-default-features --features ros2

      - name: Build with colcon
        shell: bash
        run: |
          set -euo pipefail
          workspace="${RUNNER_TEMP}/ros2_ws"
          mkdir -p "${workspace}/src"
          ln -s "${GITHUB_WORKSPACE}" "${workspace}/src/reduct_bridge"
          set +u
          source ${{ matrix.ros_setup_script }}
          set -u
          cd "${workspace}"
          rosdep install --from-paths src --ignore-src -r -y
          # Exercise the ROS build-farm path, where only the distribution's
          # system Cargo is initially available.
          env PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            colcon build --packages-select reduct_bridge
          set +u
          source install/setup.bash
          set -u
          test "$(ros2 pkg prefix reduct_bridge)" = "${workspace}/install/reduct_bridge"
          ros2 run reduct_bridge reduct-bridge --help

      - name: Run ROS 2 input smoke test
        uses: ./.github/actions/ros2-input-smoke
        with:
          bridge_binary: ${{ runner.temp }}/ros2_ws/install/reduct_bridge/lib/reduct_bridge/reduct-bridge
          ros-setup-script: ${{ runner.temp }}/ros2_ws/install/setup.bash
